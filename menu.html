<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Coffee & Honey — Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       ROOT
    ===================================================== */

    :root {
      --bg: #17120f;
      --bg-soft: #211a15;
      --card: #1d1713;
      --card-hover: #251d17;

      --cream: #f5eee3;
      --muted: #9b8d80;

      --gold: #e9b95f;
      --gold-soft: #f0c977;

      --line: rgba(255,255,255,.105);

      --display: "Playfair Display", serif;
      --sans: "DM Sans", sans-serif;
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: var(--sans);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================================
       NAV
    ===================================================== */

    .menu-nav {
      height: 82px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 4vw;

      border-bottom: 1px solid var(--line);

      position: sticky;
      top: 0;

      z-index: 100;

      background:
        rgba(23,18,15,.88);

      backdrop-filter: blur(18px);
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 2px;
    }


    .brand-mark {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255,255,255,.45);

      border-radius: 50%;

      font-family: var(--display);

      font-size: 21px;
      font-weight: 500;
    }


    .brand b {
      font-weight: 700;
    }


    .nav-actions {
      display: flex;
      align-items: center;
      gap: 25px;
    }


    .back-link {
      font-size: 13px;
      color: rgba(255,255,255,.65);

      transition: color .3s ease;
    }

    .back-link:hover {
      color: white;
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .menu-page {
      width: min(1480px, 92vw);
      margin: 0 auto;

      padding:
        70px 0 100px;
    }


    /* =====================================================
       TOP AREA
    ===================================================== */

    .menu-top {
      display: grid;

      grid-template-columns:
        1fr
        auto;

      align-items: end;

      gap: 50px;

      padding-bottom: 42px;

      border-bottom:
        1px solid var(--line);
    }


    .category-label {
      color: var(--gold);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 4px;

      margin-bottom: 15px;
    }


    .menu-heading {
      font-family: var(--display);

      font-size:
        clamp(60px, 8vw, 120px);

      font-weight: 500;

      line-height: .88;

      letter-spacing: -3px;
    }


    .menu-subtitle {
      margin-top: 22px;

      color: var(--muted);

      font-size: 15px;

      max-width: 500px;
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .search-box {
      width: min(350px, 34vw);

      height: 52px;

      display: flex;
      align-items: center;

      border: 1px solid rgba(255,255,255,.18);

      border-radius: 999px;

      background:
        rgba(255,255,255,.025);

      overflow: hidden;
    }


    .search-icon {
      width: 54px;

      display: grid;
      place-items: center;

      color: rgba(255,255,255,.7);
    }


    .search-icon svg {
      width: 19px;
      height: 19px;
    }


    .search-box input {
      flex: 1;

      height: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      color: white;

      padding-right: 15px;

      font-size: 14px;
    }


    .search-box input::placeholder {
      color: rgba(255,255,255,.42);
    }


    .search-button {
      width: 52px;
      height: 52px;

      border: 0;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          #ebc371,
          #c79845
        );

      color: #24180e;

      cursor: pointer;
    }


    .search-button svg {
      width: 18px;
      height: 18px;
    }


    /* =====================================================
       GRID
    ===================================================== */

    .food-grid {
      margin-top: 38px;

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 18px;
    }


    /* =====================================================
       CARD
    ===================================================== */

    .food-card {
      position: relative;

      overflow: hidden;

      border: 1px solid var(--line);

      border-radius: 16px;

      background: var(--card);

      transition:
        transform .45s cubic-bezier(.16,1,.3,1),
        border-color .35s ease,
        background .35s ease;
    }


    .food-card:hover {
      transform:
        translateY(-7px);

      background:
        var(--card-hover);

      border-color:
        rgba(233,185,95,.42);
    }


    /* =====================================================
       IMAGE
    ===================================================== */

    .food-image {
      position: relative;

      width: 100%;

      aspect-ratio: 1.05 / 1;

      overflow: hidden;

      background: #100c09;
    }


    .food-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform .8s
        cubic-bezier(.16,1,.3,1);
    }


    .food-card:hover
    .food-image img {
      transform: scale(1.07);
    }


    .image-shade {
      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.42),
          transparent 50%
        );
    }


    /* =====================================================
       TAG
    ===================================================== */

    .food-tag {
      position: absolute;

      top: 15px;
      right: 15px;

      padding: 7px 12px;

      border-radius: 999px;

      background:
        rgba(238,210,157,.84);

      color: #332619;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    /* =====================================================
       INFO
    ===================================================== */

    .food-content {
      padding: 20px 20px 19px;
    }


    .food-number {
      color:
        rgba(255,255,255,.32);

      font-size: 10px;

      letter-spacing: 2px;

      margin-bottom: 9px;
    }


    .food-name {
      font-family: var(--display);

      font-size: 28px;

      font-weight: 500;

      line-height: 1.05;

      margin-bottom: 10px;
    }


    .food-description {
      color:
        rgba(255,255,255,.52);

      font-size: 12px;

      line-height: 1.55;

      min-height: 38px;
    }


    .food-bottom {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-top: 19px;
    }


    .food-action {
      border: 1px solid rgba(255,255,255,.28);

      background: transparent;

      color: white;

      border-radius: 999px;

      padding: 10px 15px;

      cursor: pointer;

      font-size: 11px;

      transition:
        background .3s ease,
        border-color .3s ease;
    }


    .food-action:hover {
      background:
        rgba(255,255,255,.08);

      border-color:
        rgba(255,255,255,.5);
    }


    .food-price {
      font-family: var(--display);

      color: var(--gold-soft);

      font-size: 22px;

      white-space: nowrap;
    }


    /* =====================================================
       EMPTY SEARCH
    ===================================================== */

    .no-results {
      grid-column: 1 / -1;

      padding: 80px 20px;

      text-align: center;

      color: rgba(255,255,255,.45);

      border:
        1px solid var(--line);

      border-radius: 16px;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .menu-footer {
      margin-top: 75px;

      padding-top: 25px;

      border-top:
        1px solid var(--line);

      display: flex;

      justify-content: space-between;

      color: rgba(255,255,255,.38);

      font-size: 11px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 1100px) {

      .food-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }


    @media (max-width: 820px) {

      .menu-top {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .search-box {
        width: min(100%, 420px);
      }

      .food-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    @media (max-width: 560px) {

      .menu-nav {
        height: 72px;
        padding: 0 5vw;
      }

      .nav-actions .back-link {
        display: none;
      }

      .menu-page {
        width: 90vw;
        padding-top: 50px;
      }

      .menu-heading {
        font-size: 62px;
        letter-spacing: -2px;
      }

      .food-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .food-image {
        aspect-ratio: 1.35 / 1;
      }

      .menu-footer {
        flex-direction: column;
        gap: 10px;
      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     NAV
===================================================== -->

<header class="menu-nav">

  <a
    class="brand"
    href="index.html"
  >

    <span class="brand-mark">
      C
    </span>

    <span>
      <b>COFFEE</b> & HONEY
    </span>

  </a>


  <div class="nav-actions">

    <a
      href="index.html#menu"
      class="back-link"
    >
      ← Back to categories
    </a>

  </div>

</header>



<!-- =====================================================
     MENU
===================================================== -->

<main class="menu-page">


  <section class="menu-top">


    <div>

      <p
        class="category-label"
        id="categoryLabel"
      >
        COFFEE MENU
      </p>


      <h1
        class="menu-heading"
        id="categoryTitle"
      >
        Coffee
      </h1>


      <p
        class="menu-subtitle"
        id="categorySubtitle"
      >
        Pour, sip, slow down.
      </p>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

      <span class="search-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
          />

          <path
            d="m20 20-4-4"
          />

        </svg>

      </span>


      <input
        id="searchInput"
        type="text"
        placeholder="Search for coffee"
        autocomplete="off"
      >


      <button
        class="search-button"
        type="button"
        aria-label="Search"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
          />

          <path
            d="m20 20-4-4"
          />

        </svg>

      </button>

    </div>

  </section>



  <!-- ===================================================
       FOOD GRID
  ==================================================== -->

  <section
    class="food-grid"
    id="foodGrid"
  ></section>



  <footer class="menu-footer">

    <span>
      COFFEE & HONEY
    </span>

    <span>
      Good coffee. Sweet moments.
    </span>

    <span>
      © 2026
    </span>

  </footer>

</main>



<script>

  /* =====================================================
     MENU DATA
  ===================================================== */

  const menuData = {

    coffee: {

      label: "COFFEE MENU",

      title: "Coffee",

      subtitle:
        "Pour, sip, slow down.",

      search:
        "Search for coffee",

      items: [

        {
          name: "Americano",

          description:
            "Rich espresso & hot water.",

          price: "₹150",

          tag: "BEST SELLER",

          image:
            "https://images.unsplash.com/photo-1498804103079-a6351b050096?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Cappuccino",

          description:
            "Espresso, silky milk & soft foam.",

          price: "₹190",

          tag: "CLASSIC",

          image:
            "https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Honey Latte",

          description:
            "Velvety espresso with wildflower honey.",

          price: "₹220",

          tag: "SIGNATURE",

          image:
            "https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Iced Mocha",

          description:
            "Cold brew, chocolate & creamy milk.",

          price: "₹240",

          tag: "COLD",

          image:
            "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Flat White",

          description:
            "Double espresso with velvety microfoam.",

          price: "₹210",

          tag: "HOUSE PICK",

          image:
            "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Cold Brew",

          description:
            "Slow brewed for a smooth finish.",

          price: "₹210",

          tag: "CHILLED",

          image:
            "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Espresso",

          description:
            "Short, intense and beautifully balanced.",

          price: "₹130",

          tag: "PURE",

          image:
            "https://images.unsplash.com/photo-1610889556528-9a770e32642f?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Caramel Latte",

          description:
            "Espresso, steamed milk & caramel.",

          price: "₹230",

          tag: "SWEET",

          image:
            "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?auto=format&fit=crop&w=1000&q=85"
        }

      ]

    },


    burger: {

      label: "BURGER MENU",

      title: "Burgers",

      subtitle:
        "Stacked, juicy, unforgettable.",

      search:
        "Search for burger",

      items: [

        {
          name: "Classic Smash",

          description:
            "Double patty, cheddar & house sauce.",

          price: "₹299",

          tag: "BEST SELLER",

          image:
            "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Honey Bacon",

          description:
            "Crispy bacon, honey glaze & cheddar.",

          price: "₹349",

          tag: "SIGNATURE",

          image:
            "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Crispy Chicken",

          description:
            "Golden chicken, lettuce & spicy mayo.",

          price: "₹329",

          tag: "CRISPY",

          image:
            "https://images.unsplash.com/photo-1606755962773-d324e0a13086?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Loaded Cheese",

          description:
            "Beef patty, three-cheese blend & onions.",

          price: "₹379",

          tag: "LOADED",

          image:
            "https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "BBQ Smoke",

          description:
            "Smoky BBQ sauce, cheddar & crispy onions.",

          price: "₹359",

          tag: "SMOKY",

          image:
            "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Spicy Jalapeño",

          description:
            "Smash patty, jalapeño & pepper sauce.",

          price: "₹339",

          tag: "SPICY",

          image:
            "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Double Cheese",

          description:
            "Two patties, double cheddar & house sauce.",

          price: "₹399",

          tag: "DOUBLE",

          image:
            "https://images.unsplash.com/photo-1553979459-d2229ba7433b?auto=format&fit=crop&w=1000&q=85"
        },


        {
          name: "Mushroom Melt",

          description:
            "Grilled mushrooms, Swiss cheese & sauce.",

          price: "₹369",

          tag: "NEW",

          image:
            "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?auto=format&fit=crop&w=1000&q=85"
        }

      ]

    }

  };


  /* =====================================================
     GET CATEGORY
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const category =
    params.get("category") === "burger"
      ? "burger"
      : "coffee";


  const data =
    menuData[category];


  /* =====================================================
     UPDATE PAGE
  ===================================================== */

  document.getElementById(
    "categoryLabel"
  ).textContent =
    data.label;


  document.getElementById(
    "categoryTitle"
  ).textContent =
    data.title;


  document.getElementById(
    "categorySubtitle"
  ).textContent =
    data.subtitle;


  document.getElementById(
    "searchInput"
  ).placeholder =
    data.search;


  /* =====================================================
     RENDER
  ===================================================== */

  const grid =
    document.getElementById(
      "foodGrid"
    );


  function renderItems(items) {

    if (!items.length) {

      grid.innerHTML = `
        <div class="no-results">
          Nothing found. Try another search.
        </div>
      `;

      return;
    }


    grid.innerHTML =
      items.map((item, index) => {

        return `

          <article
            class="food-card"
          >

            <div class="food-image">

              <img
                src="${item.image}"
                alt="${item.name}"
                loading="lazy"
              >

              <div class="image-shade"></div>

              <span class="food-tag">
                ${item.tag}
              </span>

            </div>


            <div class="food-content">

              <div class="food-number">
                ${String(index + 1).padStart(2, "0")}
              </div>


              <h2 class="food-name">
                ${item.name}
              </h2>


              <p class="food-description">
                ${item.description}
              </p>


              <div class="food-bottom">

                <button
                  class="food-action"
                  type="button"
                  onclick="orderItem('${item.name}')"
                >
                  Add to order ↗
                </button>


                <span class="food-price">
                  ${item.price}
                </span>

              </div>

            </div>

          </article>

        `;

      }).join("");

  }


  renderItems(
    data.items
  );


  /* =====================================================
     SEARCH
  ===================================================== */

  const searchInput =
    document.getElementById(
      "searchInput"
    );


  searchInput.addEventListener(
    "input",
    () => {

      const query =
        searchInput.value
          .trim()
          .toLowerCase();


      if (!query) {

        renderItems(
          data.items
        );

        return;

      }


      const filtered =
        data.items.filter(
          (item) => {

            return (
              item.name
                .toLowerCase()
                .includes(query)

              ||

              item.description
                .toLowerCase()
                .includes(query)

              ||

              item.tag
                .toLowerCase()
                .includes(query)
            );

          }
        );


      renderItems(filtered);

    }
  );


  /* =====================================================
     ORDER
  ===================================================== */

  function orderItem(name) {

    const message =
      `Hi Coffee & Honey, I'd like to order ${name}.`;

    window.open(
      `https://wa.me/919999999999?text=${encodeURIComponent(message)}`,
      "_blank"
    );

  }

</script>


</body>
</html>
